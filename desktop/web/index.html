<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书源工具 · 桌面版</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --line: #e2e5ea; --text: #24292f;
    --muted: #6a737d; --primary: #2563eb; --primary-dark: #1d4ed8;
    --danger: #dc2626; --success: #16a34a; --warning: #d97706;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    height: 100vh; overflow: hidden; }
  .layout { display: flex; height: 100vh; }
  .sidebar { width: 310px; flex: none; background: var(--card);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .brand .port { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; }
  .tab { padding: 9px 14px; border-radius: 8px; cursor: pointer; color: var(--muted);
    border: 1px solid transparent; user-select: none; font-weight: 600; }
  .tab:hover { background: #f3f4f6; color: var(--text); }
  .tab.active { background: var(--primary); color: #fff; }
  .side-sec { padding: 10px 16px; border-top: 1px solid var(--line); }
  .side-sec h3 { font-size: 12px; margin: 0 0 8px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .3px; }
  .side-tasks { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .side-tasks .tasks { flex: 1; overflow-y: auto; min-height: 0; }
  .main { flex: 1; overflow-y: auto; min-width: 0; }
  .wrap { max-width: 1100px; margin: 16px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], textarea { border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font: inherit; background: #fff; width: 100%; }
  input[type=text]:focus, textarea:focus { outline: 2px solid #bfdbfe;
    border-color: var(--primary); }
  textarea { font-family: Consolas, monospace; font-size: 12px; min-height: 200px; }
  button { border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 7px 14px; font: inherit; cursor: pointer; color: var(--text); }
  button:hover { background: #f3f4f6; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: var(--primary-dark); }
  button.danger { color: var(--danger); border-color: #fecaca; }
  button.danger:hover { background: #fef2f2; }
  button.small { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line);
    vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; background: #fafbfc; }
  tr:hover td { background: #fafbfc; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 12px;
    background: #eef2ff; color: var(--primary); }
  .chip.ok { background: #dcfce7; color: var(--success); }
  .chip.off { background: #f3f4f6; color: var(--muted); }
  .chip.bad { background: #fee2e2; color: var(--danger); }
  .cover { width: 30px; height: 40px; object-fit: cover; border-radius: 3px;
    background: #eef2f7; }
  .progress { height: 8px; background: #eef2f7; border-radius: 6px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--primary); transition: width .3s; }
  .tasks { max-height: 320px; overflow-y: auto; }
  .task { padding: 8px 2px; border-bottom: 1px dashed var(--line); }
  .task:last-child { border-bottom: none; }
  .task .t-head { display: flex; justify-content: space-between; gap: 8px; }
  .task .t-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 170px; }
  .task .t-msg { color: var(--muted); font-size: 12px; margin: 3px 0; }
  .task .progress { margin-top: 4px; }
  .toast { position: fixed; right: 20px; bottom: 20px; z-index: 99;
    background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px;
    opacity: 0; transition: opacity .25s; max-width: 60vw; }
  .toast.show { opacity: .95; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: var(--radius); width: min(720px, 92vw);
    max-height: 86vh; display: flex; flex-direction: column; }
  .modal .m-head { padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .modal .m-body { padding: 12px 16px; overflow-y: auto; }
  .modal .m-foot { padding: 10px 16px; border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; gap: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 26px 0; }
  .hint { color: var(--muted); font-size: 12px; }
  .dl-link { color: var(--primary); font-weight: 600; }
  .err-text { color: var(--danger); font-size: 12px; margin-top: 6px; white-space: pre-wrap; }
  #epubDir { font-size: 12px; }
  #configHint { margin: 8px 0 0; word-break: break-all; }
</style>
</head>
<body>

<div class="layout">

  <!-- ═══ 侧边栏 ═══ -->
  <aside class="sidebar">
    <div class="brand">
      <h1>📚 书源工具</h1>
      <span class="port" id="portTag"></span>
    </div>

    <nav class="tabs">
      <div class="tab active" data-tab="search">🔍 搜索下载</div>
      <div class="tab" data-tab="sources">📚 书源管理</div>
    </nav>

    <div class="side-sec">
      <h3>EPUB 输出目录</h3>
      <input type="text" id="epubDir" placeholder="例如 D:\电子书\EPUB…">
      <div class="row" style="margin-top:8px">
        <button id="btnPickDir" class="primary small">选择文件夹…</button>
        <button id="btnSaveConfig" class="small">保存</button>
        <button id="btnResetConfig" class="small">恢复默认</button>
        <button id="btnOpenDir" class="small">打开目录</button>
      </div>
      <p class="hint" id="configHint"></p>
    </div>

    <div class="side-sec side-tasks">
      <h3>任务进度 <span id="taskCount" class="hint"></span></h3>
      <div class="tasks" id="taskList"></div>
    </div>
  </aside>

  <!-- ═══ 主区 ═══ -->
  <main class="main">
    <div class="wrap">

      <!-- 搜索下载 -->
      <div id="panel-search">
        <div class="card">
          <div class="row">
            <input type="text" id="keyword" placeholder="输入书名 / 作者关键词…"
                   style="max-width:420px" onkeydown="if(event.key==='Enter')doSearch()">
            <button id="btnSearch" class="primary" onclick="doSearch()">搜索</button>
            <span class="hint" id="searchHint"></span>
          </div>
        </div>

        <div class="card" id="resultCard" style="display:none">
          <h2>搜索结果 <span class="hint" id="resultCount"></span></h2>
          <table>
            <thead><tr>
              <th style="width:44px">封面</th><th>书名</th><th>作者</th><th>来源</th>
              <th>最新章节</th><th style="width:120px">操作</th>
            </tr></thead>
            <tbody id="resultTable"></tbody>
          </table>
        </div>
      </div>

      <!-- 书源管理 -->
      <div id="panel-sources" style="display:none">
        <div class="card">
          <div class="row">
            <input type="text" id="filterSrc" placeholder="筛选书源…" style="max-width:260px">
            <button id="btnRefresh" class="small">刷新</button>
            <button id="btnAdd" class="primary small">＋ 新增书源</button>
            <input type="text" id="importUrl" placeholder="书源订阅 URL…" style="max-width:340px">
            <button id="btnImportUrl" class="small">URL 导入</button>
            <button id="btnImportZip" class="small">ZIP 导入</button>
            <input type="file" id="zipInput" accept=".zip" style="display:none">
          </div>
        </div>
        <div class="card">
          <table>
            <thead><tr>
              <th style="width:36px">启用</th><th>名称</th><th>分组</th><th>网址</th>
              <th style="width:190px">操作</th>
            </tr></thead>
            <tbody id="srcTable"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

</div>

<!-- 新增/编辑 书源 JSON 弹窗 -->
<div class="modal-mask" id="srcModal">
  <div class="modal">
    <div class="m-head"><span id="srcModalTitle">新增书源</span>
      <button class="small" onclick="closeSrcModal()">✕</button></div>
    <div class="m-body">
      <p class="hint">粘贴 Legado 3.0 格式的书源 JSON，或直接编辑已有书源。</p>
      <textarea id="srcJson" placeholder='{"bookSourceName": "…", "bookSourceUrl": "…", "ruleSearch": {…}}'></textarea>
      <div class="err-text" id="srcJsonErr"></div>
    </div>
    <div class="m-foot">
      <button onclick="closeSrcModal()">取消</button>
      <button class="primary" onclick="saveSource()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  if (ct.includes("application/json")) return r.json();
  return { err: "non-json", status: r.status };
};
const post = (path, body) => api(path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body),
});

let sources = [];
let tasks = new Map();     // epub 任务
let searchTask = null;
let searchTimer = null;
let results = new Map();   // 搜索结果 key -> {b, src}
let activeTab = "search";

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 3200);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ── 书源管理 ── */
async function loadSources() {
  const r = await api("/api/sources");
  sources = (r.data || []);
  renderSources();
}
function renderSources() {
  const q = ($("filterSrc").value || "").toLowerCase();
  const list = sources.filter(s =>
    !q || s.bookSourceName.toLowerCase().includes(q)
      || (s.bookSourceGroup || "").toLowerCase().includes(q)
      || (s.bookSourceUrl || "").toLowerCase().includes(q));
  const tb = $("srcTable");
  if (!list.length) {
    tb.innerHTML = '<tr><td colspan="5" class="empty">暂无书源，点「＋ 新增书源」或 URL 导入</td></tr>';
    return;
  }
  tb.innerHTML = list.map(s => `
    <tr>
      <td><button class="small ${s.enabled ? "primary" : ""}"
        onclick="toggleSource('${esc(s.bookSourceName)}')">${s.enabled ? "开" : "关"}</button></td>
      <td><b>${esc(s.bookSourceName)}</b></td>
      <td>${esc(s.bookSourceGroup || "—")}</td>
      <td class="hint" style="word-break:break-all">${esc(s.bookSourceUrl)}</td>
      <td>
        <button class="small" onclick="testSource('${esc(s.bookSourceName)}')">测试</button>
        <button class="small" onclick="openEdit('${esc(s.bookSourceName)}')">编辑</button>
        <button class="small danger" onclick="delSource('${esc(s.bookSourceName)}')">删除</button>
      </td>
    </tr>`).join("");
}
async function toggleSource(name) {
  const r = await post("/api/sources/toggle", { name });
  if (r.err === "ok") { loadSources(); } else { toast(r.msg || "操作失败"); }
}
async function delSource(name) {
  if (!confirm(`确定删除书源「${name}」？`)) return;
  const r = await post("/api/sources/delete", { name });
  if (r.err === "ok") { toast("已删除"); loadSources(); } else { toast(r.msg || "删除失败"); }
}
async function testSource(name) {
  toast(`正在测试「${name}」…`);
  const r = await api("/api/sources/test?source=" + encodeURIComponent(name));
  if (r.err === "ok") {
    toast(`「${name}」连通，搜索「测试」返回 ${r.data.count} 条` +
      (r.data.samples.length ? `，例如：${r.data.samples.map(s => s.name).join(" / ")}` : ""));
  } else {
    toast(`「${name}」失败：${r.msg || "未知错误"}`);
  }
}
function openAdd() {
  $("srcModalTitle").textContent = "新增书源";
  $("srcJson").value = "";
  $("srcJsonErr").textContent = "";
  $("srcModal").classList.add("show");
}
function openEdit(name) {
  const s = sources.find(x => x.bookSourceName === name);
  if (!s) return;
  $("srcModalTitle").textContent = "编辑书源：" + name;
  $("srcJson").value = JSON.stringify(s, null, 2);
  $("srcJsonErr").textContent = "";
  $("srcModal").classList.add("show");
}
function closeSrcModal() { $("srcModal").classList.remove("show"); }
async function saveSource() {
  let raw;
  try { raw = JSON.parse($("srcJson").value); }
  catch (e) { $("srcJsonErr").textContent = "JSON 格式错误：" + e.message; return; }
  if (!raw.bookSourceName || !raw.bookSourceUrl) {
    $("srcJsonErr").textContent = "缺少 bookSourceName 或 bookSourceUrl";
    return;
  }
  if (typeof raw.header === "string" && raw.header.trim().startsWith("{")) {
    try { raw.header = JSON.parse(raw.header); } catch (e) { /* 保留原样 */ }
  }
  const r = await post("/api/sources/save", { raw });
  if (r.err === "ok") {
    toast("保存成功");
    closeSrcModal();
    loadSources();
  } else {
    $("srcJsonErr").textContent = r.msg || "保存失败";
  }
}
async function importUrl() {
  const url = $("importUrl").value.trim();
  if (!url) { toast("请输入订阅 URL"); return; }
  const r = await post("/api/sources/import_url", { url });
  toast(r.msg || (r.err === "ok" ? "导入完成" : "导入失败"));
  if (r.err === "ok") loadSources();
}
function importZipFile(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith(".zip")) { toast("请选择 .zip 文件"); return; }
  toast(`正在解析 ${file.name}…`);
  const reader = new FileReader();
  reader.onload = async () => {
    const b64 = String(reader.result).split(",")[1] || "";
    try {
      const r = await post("/api/sources/import_zip", { file_b64: b64, filename: file.name });
      toast(r.msg || (r.err === "ok" ? "导入完成" : "导入失败"));
      if (r.err === "ok") loadSources();
    } catch (e) {
      toast("导入失败：" + String(e));
    }
  };
  reader.onerror = () => toast("读取文件失败");
  reader.readAsDataURL(file);
}

/* ── 搜索 ── */
function resultScore(b, kw) {
  const name = (b.name || "").toLowerCase();
  const author = (b.author || "").toLowerCase();
  if (!kw) return 200;
  if (name === kw) return 1000;               // 完全匹配
  if (name.startsWith(kw)) return 800;        // 前缀匹配
  if (name.includes(kw)) return 600;          // 包含匹配
  if (author.includes(kw)) return 400;        // 作者匹配
  return 200;                                 // 其余
}
function rowHtml(r) {
  const b = r.b;
  return `<tr>
    <td>${b.coverUrl ? `<img class="cover" src="${esc(b.coverUrl)}" onerror="this.style.visibility='hidden'">` : ""}</td>
    <td><b>${esc(b.name)}</b></td>
    <td>${esc(b.author)}</td>
    <td><span class="chip">${esc(r.src)}</span></td>
    <td class="hint" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.lastChapter)}</td>
    <td><button class="small primary" onclick="genEpub('${esc(r.src)}','${esc(b.bookUrl)}','${esc(b.name)}')">生成 EPUB</button></td>
  </tr>`;
}
function renderResults(done, total) {
  const kw = ($("keyword").value || "").trim().toLowerCase();
  const arr = Array.from(results.values()).map(r => ({ r, score: resultScore(r.b, kw) }));
  arr.sort((a, b) =>
    b.score - a.score                                     // 相关度
    || (a.r.b.name || "").length - (b.r.b.name || "").length  // 短书名优先
    || (a.r.b.name || "").localeCompare(b.r.b.name || "", "zh")
    || a.r.src.localeCompare(b.r.src));
  $("resultTable").innerHTML = arr.map(x => rowHtml(x.r)).join("");
  $("resultCount").textContent = `(${results.size} 条 · ${done}/${total} 源完成)`;
  return results.size;
}
async function doSearch() {
  const kw = $("keyword").value.trim();
  if (!kw) { toast("请输入关键词"); return; }
  stopSearchPoll();
  searchTask = null;
  results = new Map();
  $("resultTable").innerHTML = "";
  $("resultCard").style.display = "none";
  const r = await post("/api/search", { keyword: kw });
  if (r.err !== "ok") { toast(r.msg || "搜索失败"); return; }
  searchTask = r.data.task_id;
  const total = r.data.total;
  $("searchHint").textContent = `共 ${total} 个书源并发搜索中…`;
  $("resultCard").style.display = "";
  searchTimer = setInterval(pollSearch, 1200);
}
async function pollSearch() {
  if (!searchTask) return;
  const r = await api("/api/search/status?task_id=" + encodeURIComponent(searchTask));
  if (r.err !== "ok" || !r.data) { stopSearchPoll(); return; }
  const d = r.data;
  (d.results || []).forEach(res => {
    (res.books || []).forEach(b => {
      const key = b.bookUrl + "|" + res.source_name;
      if (results.has(key)) return;
      results.set(key, { b, src: res.source_name });
    });
  });
  const n = renderResults(d.done, d.total);
  if (d.finished) {
    stopSearchPoll();
    $("searchHint").textContent = `搜索完成，共 ${n} 条结果（${d.done}/${d.total} 源完成）`;
  }
}
function stopSearchPoll() {
  if (searchTimer) { clearInterval(searchTimer); searchTimer = null; }
}

/* ── EPUB 生成任务 ── */
async function genEpub(source, bookUrl, name) {
  const key = bookUrl + "|" + source;
  if (tasks.has(key) && ["running"].includes(tasks.get(key).status)) {
    toast("该书籍已在生成中"); return;
  }
  const r = await post("/api/epub/generate", {
    source, bookUrl, bookTitle: name, maxChapters: 9999,
  });
  if (r.err !== "ok") { toast(r.msg || "启动失败"); return; }
  const task = { key, source, name, taskId: r.data.task_id, status: "running",
    progress: 0, message: "初始化" };
  tasks.set(key, task);
  renderTasks();
}
function renderTasks() {
  const box = $("taskList");
  const arr = Array.from(tasks.values()).reverse();
  const running = arr.filter(t => t.status === "running").length;
  $("taskCount").textContent = running ? `(${running} 进行中)` : "";
  if (!arr.length) {
    box.innerHTML = '<div class="empty" style="padding:14px 0">暂无任务</div>';
    return;
  }
  box.innerHTML = arr.map(t => `
    <div class="task">
      <div class="t-head">
        <b class="t-name" title="${esc(t.name)}">${esc(t.name)}</b>
        <span class="chip ${t.status === "done" ? "ok" : t.status === "failed" ? "bad" : ""}">${t.statusText || t.status}</span>
      </div>
      <div class="t-msg">${esc(t.message)}</div>
      ${t.link ? `<div class="t-msg"><a class="dl-link" href="${esc(t.link)}">点击下载 EPUB</a></div>` : ""}
      <div class="progress"><div style="width:${t.progress}%"></div></div>
    </div>`).join("");
}
async function pollEpubTasks() {
  const running = Array.from(tasks.values()).filter(t => t.status === "running");
  for (const t of running) {
    const r = await api("/api/epub/status?task_id=" + encodeURIComponent(t.taskId));
    if (r.err !== "ok" || !r.data) continue;
    t.progress = r.data.progress;
    t.message = r.data.message;
    if (r.data.status === "done") {
      t.status = "done"; t.statusText = "完成";
      t.link = "/api/epub/download?task_id=" + encodeURIComponent(t.taskId);
      t.message = "生成完成";
      toast(`「${t.name}」生成完成`);
    } else if (r.data.status === "failed") {
      t.status = "failed"; t.statusText = "失败";
      t.message = r.data.error || r.data.message;
      toast(`「${t.name}」生成失败：${(r.data.error || "").slice(0, 120)}`);
    } else if (r.data.status === "cancelled") {
      t.status = "cancelled"; t.statusText = "已取消";
    }
  }
  renderTasks();
}
setInterval(pollEpubTasks, 1000);

/* ── 设置（EPUB 输出目录） ── */
async function loadConfig() {
  const r = await api("/api/config");
  if (r.err !== "ok") return;
  const d = r.data;
  $("epubDir").value = d.epub_dir || "";
  $("configHint").textContent = d.is_custom
    ? `当前：${d.epub_dir}`
    : `默认：${d.epub_dir}`;
}
async function saveConfig() {
  const epubDir = $("epubDir").value.trim();
  const r = await post("/api/config", { epub_dir: epubDir });
  if (r.err === "ok") {
    toast(r.msg || "已保存");
    loadConfig();
  } else {
    toast(r.msg || "保存失败");
  }
}
async function resetConfig() {
  const r = await post("/api/config", { epub_dir: "" });
  if (r.err === "ok") { toast("已恢复默认"); loadConfig(); }
  else { toast(r.msg || "操作失败"); }
}
async function openDir() {
  const r = await post("/api/config/open", {});
  if (r.err !== "ok") toast(r.msg || "打开失败");
}
async function pickDir() {
  toast("请在弹出的窗口中选择文件夹…");
  const r = await post("/api/config/pick", {});
  if (r.err !== "ok") { toast(r.msg || "选择失败"); return; }
  if (r.data && r.data.path) {
    $("epubDir").value = r.data.path;
    toast("已选择目录，点「保存」生效");
  }
}

/* ── 标签页 ── */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeTab = tab.dataset.tab;
    $("panel-search").style.display = activeTab === "search" ? "" : "none";
    $("panel-sources").style.display = activeTab === "sources" ? "" : "none";
  });
});

/* ── 初始化 ── */
(async function init() {
  $("portTag").textContent = "localhost:" + location.port;
  $("btnRefresh").addEventListener("click", loadSources);
  $("btnAdd").addEventListener("click", openAdd);
  $("btnImportUrl").addEventListener("click", importUrl);
  $("btnImportZip").addEventListener("click", () => $("zipInput").click());
  $("zipInput").addEventListener("change", e => {
    importZipFile(e.target.files[0]);
    e.target.value = "";
  });
  $("filterSrc").addEventListener("input", renderSources);
  $("btnSaveConfig").addEventListener("click", saveConfig);
  $("btnResetConfig").addEventListener("click", resetConfig);
  $("btnOpenDir").addEventListener("click", openDir);
  $("btnPickDir").addEventListener("click", pickDir);
  await loadSources();
  await loadConfig();
  renderTasks();
  // 关闭弹窗：点遮罩
  $("srcModal").addEventListener("click", e => {
    if (e.target === $("srcModal")) closeSrcModal();
  });
  window.closeSrcModal = closeSrcModal;
  window.saveSource = saveSource;
  window.openEdit = openEdit;
  window.toggleSource = toggleSource;
  window.delSource = delSource;
  window.testSource = testSource;
  window.doSearch = doSearch;
  window.genEpub = genEpub;
  window.openAdd = openAdd;
  window.importUrl = importUrl;
})();
</script>
</body>
